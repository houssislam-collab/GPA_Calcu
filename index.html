<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designed by HMD - BAC 2026 النظام المتكامل</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
        body { 
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }
        input::-webkit-outer-spin-button, 
        input::-webkit-inner-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        .animate-pulse-glow {
            animation: pulse-glow 3s ease-in-out infinite;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #ec4899, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-animation {
            animation: scaleIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Appwrite Configuration
        const { Client, Account, Databases, ID, Query } = window.Appwrite;
        const client = new Client()
            .setEndpoint('https://fra.cloud.appwrite.io/v1')
            .setProject('6988df30002f5dcb4f7d');
        const account = new Account(client);
        const databases = new Databases(client);
        const DATABASE_ID = '6988df7f0000d935ff6b';
        const STUDENTS_COLLECTION_ID = 'students';
        const GRADES_COLLECTION_ID = 'grades';
        const ADMIN_EMAIL = atob('YWRtaW5AaG1kLmNvbQ==');

        // Lucide Icon Component
        const LucideIcon = ({ name, className }) => {
            useEffect(() => { window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const GradeCalculator = () => {
            const [view, setView] = useState('login');
            const [authMode, setAuthMode] = useState('login');
            const [currentUser, setCurrentUser] = useState(null);
            const [isGuest, setIsGuest] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showAdminPanel, setShowAdminPanel] = useState(false);
            
            const [timer, setTimer] = useState({ days: 0, hours: 0, minutes: 0 });
            const [level, setLevel] = useState('1');
            const [stream, setStream] = useState('');
            const [tamazight, setTamazight] = useState(false);
            const [art, setArt] = useState(false);
            const [gpaData, setGpaData] = useState([]);
            const [gpaResult, setGpaResult] = useState(null);
            
            const [yearlyData, setYearlyData] = useState({ t1: '', t2: '', t3: '' });
            const [yearlyResult, setYearlyResult] = useState(null);
            
            const [targetData, setTargetData] = useState({ target: '', eval: '', test1: '', test2: '' });
            const [targetResult, setTargetResult] = useState(null);
            
            const [bacStream, setBacStream] = useState('');
            const [bacTamazight, setBacTamazight] = useState(false);
            const [bacData, setBacData] = useState([]);
            const [bacResult, setBacResult] = useState(null);

            const [students, setStudents] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');

            const db = {
                "1": {
                    "جذع مشترك علوم وتكنولوجيا": [
                        ["رياضيات", 5], ["علوم طبيعية", 4], ["علوم فيزيائية", 4],
                        ["لغة عربية", 3], ["لغة فرنسية", 2], ["لغة إنجليزية", 2],
                        ["تاريخ وجغرافيا", 2], ["علوم إسلامية", 2], ["تكنولوجيا", 2],
                        ["معلوماتية", 2], ["تربية بدنية", 1]
                    ],
                    "جذع مشترك آداب": [
                        ["لغة عربية", 5], ["فلسفة", 5], ["تاريخ وجغرافيا", 4],
                        ["لغة فرنسية", 3], ["لغة إنجليزية", 2], ["رياضيات", 2],
                        ["علوم إسلامية", 2], ["علوم طبيعية", 2], ["علوم فيزيائية", 2],
                        ["تربية بدنية", 1]
                    ]
                },
                "2": {
                    "علوم تجريبية": [
                        ["علوم طبيعية", 6], ["رياضيات", 5], ["علوم فيزيائية", 5],
                        ["لغة عربية", 2], ["لغة فرنسية", 2], ["لغة إنجليزية", 2],
                        ["تاريخ وجغرافيا", 2], ["علوم إسلامية", 2], ["تربية بدنية", 1]
                    ],
                    "رياضيات": [
                        ["رياضيات", 7], ["علوم فيزيائية", 6], ["علوم طبيعية", 2],
                        ["لغة عربية", 2], ["لغة فرنسية", 2], ["لغة إنجليزية", 2],
                        ["تاريخ وجغرافيا", 2], ["علوم إسلامية", 2], ["فلسفة", 2],
                        ["تربية بدنية", 1]
                    ],
                    "تقني رياضي": [
                        ["تكنولوجيا", 6], ["رياضيات", 6], ["علوم فيزيائية", 5],
                        ["لغة عربية", 2], ["لغة فرنسية", 2], ["لغة إنجليزية", 2],
                        ["تاريخ وجغرافيا", 1], ["علوم إسلامية", 2], ["فلسفة", 2],
                        ["تربية بدنية", 1]
                    ],
                    "تسيير واقتصاد": [
                        ["تسيير محاسبي ومالي", 5], ["اقتصاد ومناجمنت", 4], ["قانون", 2],
                        ["رياضيات", 3], ["تاريخ وجغرافيا", 3], ["لغة عربية", 2],
                        ["لغة فرنسية", 2], ["لغة إنجليزية", 2], ["علوم إسلامية", 2],
                        ["تربية بدنية", 1]
                    ],
                    "آداب وفلسفة": [
                        ["لغة عربية", 5], ["فلسفة", 5], ["تاريخ وجغرافيا", 4],
                        ["لغة فرنسية", 3], ["لغة إنجليزية", 2], ["رياضيات", 2],
                        ["علوم إسلامية", 2], ["علوم طبيعية", 2], ["علوم فيزيائية", 2],
                        ["تربية بدنية", 1]
                    ],
                    "لغات أجنبية": [
                        ["لغة عربية", 4], ["لغة فرنسية", 4], ["لغة إنجليزية", 4],
                        ["لغة أجنبية ثالثة", 4], ["تاريخ وجغرافيا", 4], ["رياضيات", 2],
                        ["علوم إسلامية", 2], ["فلسفة", 2], ["تربية بدنية", 1]
                    ]
                },
                "3": {
                    "علوم تجريبية": [
                        ["رياضيات", 4], ["علوم طبيعية", 5], ["فيزياء", 5],
                        ["عربية", 2], ["فرنسية", 2], ["إنجليزية", 2],
                        ["تاريخ وجغرافيا", 1], ["تربية إسلامية", 2], ["فلسفة", 2],
                        ["تربية بدنية", 1]
                    ],
                    "رياضيات": [
                        ["رياضيات", 7], ["فيزياء", 6], ["علوم طبيعية", 2],
                        ["عربية", 2], ["فرنسية", 2], ["إنجليزية", 2],
                        ["تاريخ وجغرافيا", 1], ["تربية إسلامية", 2], ["فلسفة", 2],
                        ["تربية بدنية", 1]
                    ],
                    "تقني رياضي": [
                        ["رياضيات", 5], ["فيزياء", 5], ["تكنولوجيا", 7],
                        ["عربية", 2], ["فرنسية", 2], ["إنجليزية", 2],
                        ["تاريخ وجغرافيا", 1], ["تربية إسلامية", 2], ["فلسفة", 2],
                        ["تربية بدنية", 1]
                    ],
                    "تسيير واقتصاد": [
                        ["رياضيات", 3], ["اقتصاد وتسيير", 5], ["قانون", 3],
                        ["محاسبة ومالية", 4], ["عربية", 2], ["فرنسية", 2],
                        ["إنجليزية", 2], ["تاريخ وجغرافيا", 2], ["تربية إسلامية", 2],
                        ["فلسفة", 2], ["تربية بدنية", 1]
                    ],
                    "آداب وفلسفة": [
                        ["فلسفة", 7], ["عربية", 5], ["فرنسية", 3],
                        ["إنجليزية", 2], ["تاريخ وجغرافيا", 3], ["تربية إسلامية", 2],
                        ["رياضيات", 2], ["علوم طبيعية", 1], ["تربية بدنية", 1]
                    ],
                    "لغات أجنبية": [
                        ["فرنسية", 5], ["إنجليزية", 4], ["عربية", 4],
                        ["إسبانية/ألمانية", 4], ["تاريخ وجغرافيا", 2], ["تربية إسلامية", 2],
                        ["فلسفة", 2], ["رياضيات", 2], ["تربية بدنية", 1]
                    ]
                }
            };

            useEffect(() => {
                checkSession();
                const update = () => {
                    const diff = Math.max(0, new Date("June 8, 2026 08:00:00") - new Date());
                    setTimer({
                        days: Math.floor(diff / 86400000),
                        hours: Math.floor((diff % 86400000) / 3600000),
                        minutes: Math.floor((diff % 3600000) / 60000)
                    });
                };
                update();
                const interval = setInterval(update, 60000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (view === 'gpa' && level && db[level]) {
                    const streams = Object.keys(db[level]);
                    if (!stream || !streams.includes(stream)) {
                        setStream(streams[0]);
                    }
                }
            }, [view, level]);

            useEffect(() => {
                if (view === 'gpa' && level && stream && db[level] && db[level][stream]) {
                    initGPA();
                }
            }, [view, level, stream, tamazight, art]);

            useEffect(() => {
                if (view === 'bac' && db["3"]) {
                    const streams = Object.keys(db["3"]);
                    if (!bacStream || !streams.includes(bacStream)) {
                        setBacStream(streams[0]);
                    }
                }
            }, [view]);

            useEffect(() => {
                if (view === 'bac' && bacStream && db["3"] && db["3"][bacStream]) {
                    initBAC();
                }
            }, [view, bacStream, bacTamazight]);

            const checkSession = async () => {
                try {
                    const user = await account.get();
                    setCurrentUser(user);
                    setIsAdmin(user.email === ADMIN_EMAIL);
                    setView('home');
                } catch {
                    setView('login');
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                const email = e.target.email.value;
                const password = e.target.password.value;
                try {
                    await account.createEmailPasswordSession(email, password);
                    const user = await account.get();
                    setCurrentUser(user);
                    setIsAdmin(user.email === ADMIN_EMAIL);
                    setView('home');
                    showSuccess('تم تسجيل الدخول بنجاح! 🎉');
                } catch (err) {
                    setError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
                } finally {
                    setLoading(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                const name = e.target.name.value;
                const email = e.target.email.value;
                const password = e.target.password.value;
                try {
                    await account.create(ID.unique(), email, password, name);
                    await account.createEmailPasswordSession(email, password);
                    const user = await account.get();
                    await databases.createDocument(DATABASE_ID, STUDENTS_COLLECTION_ID, ID.unique(), {
                        userId: user.$id,
                        fullName: name,
                        email: email,
                        password: password,
                        avatar: name.charAt(0).toUpperCase()
                    });
                    setCurrentUser(user);
                    setIsAdmin(user.email === ADMIN_EMAIL);
                    setView('home');
                    showSuccess('تم إنشاء الحساب بنجاح! 🎉');
                } catch (err) {
                    if (err.code === 409) setError('البريد الإلكتروني مُستخدم بالفعل');
                    else setError('خطأ في إنشاء الحساب');
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = async () => {
                try {
                    if (!isGuest) await account.deleteSession('current');
                    setCurrentUser(null);
                    setIsAdmin(false);
                    setIsGuest(false);
                    setView('login');
                    showSuccess('تم تسجيل الخروج بنجاح!');
                } catch (err) {
                    console.error(err);
                }
            };

            const continueAsGuest = () => {
                setIsGuest(true);
                setCurrentUser({ name: 'ضيف', email: 'guest@local' });
                setView('home');
                showSuccess('مرحباً! أنت في وضع الضيف 👤');
            };

            const initGPA = () => {
                let list = [...db[level][stream]];
                if (tamazight) list.push(["أمازيغية", 2]);
                if (art) list.push(["تربية فنية", 1]);
                setGpaData(list.map(([name, coef]) => ({ 
                    name, coef, eval: '', practical: '', test1: '', test2: '', exam: '' 
                })));
                setGpaResult(null);
            };

            const initBAC = () => {
                let list = [...db["3"][bacStream]];
                if (bacTamazight) list.push(["أمازيغية", 2]);
                setBacData(list.map(([name, coef]) => ({ name, coef, mark: '' })));
                setBacResult(null);
            };

            const calculateGPA = () => {
                let totalPoints = 0, totalCoef = 0;
                gpaData.forEach(s => {
                    const e = parseFloat(s.eval) || 0;
                    const p = parseFloat(s.practical) || 0;
                    const t1 = parseFloat(s.test1) || 0;
                    const t2 = parseFloat(s.test2) || 0;
                    const ex = parseFloat(s.exam) || 0;
                    
                    let avg = 0;
                    if (s.name === "أمازيغية" || s.name === "تربية فنية") {
                        avg = t2 > 0 ? (e + p + t1 + t2 + (ex * 2)) / 6 : (e + p + t1 + (ex * 2)) / 5;
                        const extra = avg > 10 ? (avg - 10) * s.coef : 0;
                        totalPoints += extra;
                    } else {
                        avg = t2 > 0 ? (e + p + t1 + t2 + (ex * 2)) / 6 : (e + p + t1 + (ex * 2)) / 5;
                        totalPoints += avg * s.coef;
                        totalCoef += s.coef;
                    }
                });
                
                const result = (totalPoints / totalCoef).toFixed(2);
                setGpaResult(result);
                showSuccess('تم حساب المعدل! 📊');
            };

            const calculateYearly = () => {
                const t1 = parseFloat(yearlyData.t1) || 0;
                const t2 = parseFloat(yearlyData.t2) || 0;
                const t3 = parseFloat(yearlyData.t3) || 0;
                if (!t1 || !t2 || !t3) {
                    setError('يرجى إدخال جميع المعدلات');
                    return;
                }
                const result = ((t1 + t2 + (t3 * 3)) / 5).toFixed(2);
                setYearlyResult(result);
                showSuccess('تم حساب المعدل السنوي! 📅');
            };

            const calculateTarget = () => {
                const target = parseFloat(targetData.target);
                const evalMark = parseFloat(targetData.eval) || 0;
                const test1 = parseFloat(targetData.test1) || 0;
                const test2 = parseFloat(targetData.test2) || 0;
                
                if (!target) {
                    setError('يرجى إدخال المعدل المطلوب');
                    return;
                }
                
                const divisor = test2 > 0 ? 5 : 4;
                const needed = ((target * divisor) - evalMark - test1 - test2) / 2;
                setTargetResult(needed.toFixed(2));
                showSuccess('تم حساب العلامة المطلوبة! 🎯');
            };

            const calculateBAC = () => {
                let totalPoints = 0, totalCoef = 0;
                bacData.forEach(s => {
                    const mark = parseFloat(s.mark) || 0;
                    if (s.name === "أمازيغية") {
                        const extra = mark > 10 ? (mark - 10) * s.coef : 0;
                        totalPoints += extra;
                    } else {
                        totalPoints += mark * s.coef;
                        totalCoef += s.coef;
                    }
                });
                
                setBacResult({
                    points: totalPoints.toFixed(2),
                    coef: totalCoef,
                    avg: (totalPoints / totalCoef).toFixed(2)
                });
                showSuccess('تم حساب معدل BAC! 🎓');
            };

            const saveData = async () => {
                if (isGuest) {
                    setError('سجل الدخول لحفظ البيانات');
                    return;
                }
                try {
                    const vals = gpaData.map(s => ({
                        eval: s.eval, practical: s.practical, test1: s.test1, test2: s.test2, exam: s.exam
                    }));
                    const existing = await databases.listDocuments(DATABASE_ID, GRADES_COLLECTION_ID, [
                        Query.equal('userId', currentUser.$id),
                        Query.equal('year', level),
                        Query.equal('stream', stream)
                    ]);
                    const data = {
                        userId: currentUser.$id,
                        year: level,
                        stream: stream,
                        grades: JSON.stringify(vals),
                        updatedAt: new Date().toISOString()
                    };
                    if (existing.documents.length > 0) {
                        await databases.updateDocument(DATABASE_ID, GRADES_COLLECTION_ID, existing.documents[0].$id, data);
                    } else {
                        await databases.createDocument(DATABASE_ID, GRADES_COLLECTION_ID, ID.unique(), data);
                    }
                    showSuccess('تم الحفظ! 💾');
                } catch {
                    setError('فشل الحفظ');
                }
            };

            const loadData = async () => {
                if (isGuest) {
                    setError('سجل الدخول لاسترجاع البيانات');
                    return;
                }
                try {
                    const response = await databases.listDocuments(DATABASE_ID, GRADES_COLLECTION_ID, [
                        Query.equal('userId', currentUser.$id),
                        Query.equal('year', level),
                        Query.equal('stream', stream)
                    ]);
                    if (response.documents.length > 0) {
                        const vals = JSON.parse(response.documents[0].grades);
                        setGpaData(gpaData.map((s, i) => ({ ...s, ...vals[i] })));
                        showSuccess('تم الاسترجاع! 📥');
                    } else {
                        setError('لا توجد بيانات محفوظة');
                    }
                } catch {
                    setError('فشل الاسترجاع');
                }
            };

            const loadStudents = async () => {
                try {
                    const response = await databases.listDocuments(DATABASE_ID, STUDENTS_COLLECTION_ID, [Query.limit(100)]);
                    setStudents(response.documents);
                } catch {
                    setError('فشل تحميل البيانات');
                }
            };

            const showSuccess = (msg) => {
                setSuccess(msg);
                setTimeout(() => setSuccess(''), 3000);
            };

            // Login/Register View
            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-purple-900 p-4 md:p-6 relative overflow-hidden" dir="rtl">
                        <div className="absolute inset-0 overflow-hidden pointer-events-none">
                            <div className="absolute top-20 left-20 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl animate-pulse-glow"></div>
                            <div className="absolute bottom-20 right-20 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl animate-pulse-glow" style={{ animationDelay: '1.5s' }}></div>
                        </div>

                        <div className="max-w-md mx-auto pt-8 md:pt-16 relative z-10">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4 animate-float">🎓</div>
                                <h1 className="text-4xl md:text-5xl font-black gradient-text mb-2">
                                    HMD - BAC 2026
                                </h1>
                                <p className="text-gray-300 text-lg">النظام المتكامل</p>
                            </div>

                            <div className="glass-effect rounded-3xl p-6 md:p-8 shadow-2xl">
                                <div className="flex gap-2 mb-6 p-1 bg-white/5 rounded-2xl">
                                    <button 
                                        onClick={() => setAuthMode('login')}
                                        className={`flex-1 py-3 px-4 rounded-xl font-bold transition-all ${
                                            authMode === 'login' 
                                                ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg' 
                                                : 'text-gray-300 hover:text-white'
                                        }`}>
                                        تسجيل الدخول
                                    </button>
                                    <button 
                                        onClick={() => setAuthMode('register')}
                                        className={`flex-1 py-3 px-4 rounded-xl font-bold transition-all ${
                                            authMode === 'register' 
                                                ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg' 
                                                : 'text-gray-300 hover:text-white'
                                        }`}>
                                        إنشاء حساب
                                    </button>
                                </div>

                                {error && (
                                    <div className="mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-xl text-red-200 text-sm text-center">
                                        ⚠️ {error}
                                    </div>
                                )}

                                {authMode === 'login' ? (
                                    <form onSubmit={handleLogin} className="space-y-4">
                                        <div>
                                            <label className="block text-white font-semibold mb-2 text-sm">البريد الإلكتروني</label>
                                            <input 
                                                type="email" 
                                                name="email"
                                                required
                                                className="w-full p-3 bg-white/10 border-2 border-white/20 rounded-xl text-white placeholder-gray-400 outline-none focus:border-indigo-400 transition-all"
                                                placeholder="example@email.com"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-white font-semibold mb-2 text-sm">كلمة المرور</label>
                                            <input 
                                                type="password" 
                                                name="password"
                                                required
                                                className="w-full p-3 bg-white/10 border-2 border-white/20 rounded-xl text-white placeholder-gray-400 outline-none focus:border-indigo-400 transition-all"
                                                placeholder="••••••••"
                                            />
                                        </div>
                                        <button 
                                            type="submit"
                                            disabled={loading}
                                            className="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 disabled:opacity-50">
                                            {loading ? '⏳ جاري الدخول...' : '🚀 تسجيل الدخول'}
                                        </button>
                                    </form>
                                ) : (
                                    <form onSubmit={handleRegister} className="space-y-4">
                                        <div>
                                            <label className="block text-white font-semibold mb-2 text-sm">الاسم الكامل</label>

                                                type="text" 
                                                name="name"
                                                required
                                                className="w-full p-3 bg-white/10 border-2 border-white/20 rounded-xl text-white placeholder-gray-400 outline-none focus:border-indigo-400 transition-all"
                                                placeholder="أدخل اسمك الكامل"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-white font-semibold mb-2 text-sm">البريد الإلكتروني</label>
                                            <input 
                                                type="email" 
                                                name="email"
                                                required
                                                className="w-full p-3 bg-white/10 border-2 border-white/20 rounded-xl text-white placeholder-gray-400 outline-none focus:border-indigo-400 transition-all"
                                                placeholder="example@email.com"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-white font-semibold mb-2 text-sm">كلمة المرور</label>
                                            <input 
                                                type="password" 
                                                name="password"
                                                required
                                                minLength="8"
                                                className="w-full p-3 bg-white/10 border-2 border-white/20 rounded-xl text-white placeholder-gray-400 outline-none focus:border-indigo-400 transition-all"
                                                placeholder="••••••••"
                                            />
                                        </div>
                                        <button 
                                            type="submit"
                                            disabled={loading}
                                            className="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 disabled:opacity-50">
                                            {loading ? '⏳ جاري الإنشاء...' : '✨ إنشاء حساب'}
                                        </button>
                                    </form>
                                )}

                                <div className="mt-6 pt-6 border-t border-white/10">
                                    <button 
                                        onClick={continueAsGuest}
                                        className="w-full py-3 bg-white/10 hover:bg-white/20 text-white font-semibold rounded-xl transition-all">
                                        👤 المتابعة كضيف
                                    </button>
                                </div>
                            </div>
                        </div>

                        {success && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50 animate-bounce">
                                {success}
                            </div>
                        )}

                );

            if (view === 'home') {

                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-purple-900 p-4 md:p-6 relative overflow-hidden" dir="rtl">

                            <div className="absolute top-20 left-20 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl animate-pulse-glow"></div>
                            <div className="absolute bottom-20 right-20 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl animate-pulse-glow" style={{ animationDelay: '1s' }}></div>
                        </div>

                        <div className="max-w-4xl mx-auto pt-4 md:pt-8 relative z-10">
                            {/* User Info */}
                            <div className="flex items-center justify-between mb-6 glass-effect p-4 rounded-2xl">
                                <div className="flex items-center gap-3">
                                    <div className="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-full flex items-center justify-center text-white font-bold text-lg">
                                        {isGuest ? '👤' : (currentUser?.name?.charAt(0) || 'U')}
                                    </div>
                                    <div>
                                        <div className="text-white font-bold">
                                            {isGuest && <span className="bg-gray-600 text-xs px-2 py-1 rounded-lg ml-2">ضيف</span>}
                                            {currentUser?.name || 'مستخدم'}
                                        </div>
                                        <div className="text-gray-400 text-sm">{currentUser?.email}</div>
                                    </div>
                                </div>
                                <div className="flex gap-2">
                                    {isAdmin && (
                                        <button 
                                            onClick={() => { setShowAdminPanel(!showAdminPanel); if (!showAdminPanel) loadStudents(); }}
                                            className="px-4 py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl font-semibold transition-all text-sm">
                                            <LucideIcon name="shield" className="w-4 h-4 inline ml-1" />
                                            {showAdminPanel ? 'إخفاء' : 'لوحة التحكم'}
                                        </button>
                                    )}
                                    <button 
                                        onClick={handleLogout}
                                        className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl font-semibold transition-all text-sm">
                                        <LucideIcon name="log-out" className="w-4 h-4 inline ml-1" />
                                        خروج
                                    </button>
                                </div>
                            </div>

                            {/* Admin Panel */}
                            {showAdminPanel && isAdmin && (
                                <div className="glass-effect rounded-3xl p-6 mb-6 shadow-2xl">
                                    <h2 className="text-2xl font-black text-white mb-4">
                                        <LucideIcon name="shield" className="w-6 h-6 inline ml-2" />
                                        لوحة التحكم
                                    </h2>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-white text-sm">
                                            <thead className="bg-white/10">
                                                <tr>
                                                    <th className="p-3 text-right">#</th>
                                                    <th className="p-3 text-right">الاسم</th>
                                                    <th className="p-3 text-right">البريد</th>
                                                    <th className="p-3 text-right">التاريخ</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {students.map((s, i) => (
                                                    <tr key={s.$id} className="border-t border-white/10 hover:bg-white/5">
                                                        <td className="p-3">{i + 1}</td>
                                                        <td className="p-3">{s.fullName}</td>
                                                        <td className="p-3">{s.email}</td>
                                                        <td className="p-3">{new Date(s.$createdAt).toLocaleDateString('ar')}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* Header */}
                            <div className="text-center mb-8 md:mb-12">
                                <h1 className="text-3xl md:text-5xl font-black gradient-text mb-2 md:mb-3">
                                    Designed by HMD
                                </h1>
                                <p className="text-gray-300 text-base md:text-lg">نظام حساب المعدلات الاحترافي</p>
                            </div>

                            {/* Timer */}
                            <div className="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 rounded-2xl md:rounded-3xl p-5 md:p-8 shadow-2xl mb-6 md:mb-8 backdrop-blur-xl border border-white/10">
                                <div className="flex items-center justify-center gap-2 md:gap-3 mb-4 md:mb-6">
                                    <LucideIcon name="clock" className="w-6 h-6 md:w-8 md:h-8 text-white" />
                                    <h2 className="text-white text-lg md:text-2xl font-bold">موعد بكالوريا BAC 2026</h2>
                                </div>
                                <div className="grid grid-cols-3 gap-3 md:gap-4">
                                    {[{ l: 'يوم', v: timer.days }, { l: 'ساعة', v: timer.hours }, { l: 'دقيقة', v: timer.minutes }].map((t, i) => (
                                        <div key={i} className="bg-white/20 backdrop-blur-md rounded-2xl p-4 md:p-6 text-center border border-white/10">
                                            <div className="text-3xl md:text-5xl font-bold text-white mb-1 md:mb-2">{t.v}</div>
                                            <div className="text-white/90 text-sm md:text-base">{t.l}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Menu Cards */}
                            <div className="space-y-3 md:space-y-4">
                                {[
                                    { icon: 'calculator', title: 'المعدل الفصلي', desc: 'احسب معدلك الفصلي بدقة', color: 'indigo', page: 'gpa' },
                                    { icon: 'calendar', title: 'المعدل السنوي', desc: 'احسب المعدل السنوي من الفصول الثلاثة', color: 'purple', page: 'yearly' },
                                    { icon: 'target', title: 'العلامة المطلوبة', desc: 'اعرف العلامة التي تحتاجها', color: 'pink', page: 'target' },
                                    { icon: 'graduation-cap', title: 'معدل BAC', desc: 'احسب معدل شهادة البكالوريا', color: 'cyan', page: 'bac' }
                                ].map((card, i) => (
                                    <button key={i} onClick={() => setView(card.page)}
                                        className="w-full glass-effect rounded-2xl md:rounded-3xl p-5 md:p-6 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-1 group hover:bg-white/15">
                                        <div className="flex items-center gap-4 md:gap-5 text-right">
                                            <div className={`bg-gradient-to-br from-${card.color}-500 to-${card.color}-600 p-4 md:p-5 rounded-2xl group-hover:scale-110 transition-transform flex-shrink-0 shadow-lg`}>

                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h3 className="text-lg md:text-2xl font-bold text-white mb-1">{card.title}</h3>
                                                <p className="text-gray-300 text-sm md:text-base">{card.desc}</p>
                                            </div>
                                            <LucideIcon name="arrow-right" className="w-6 h-6 md:w-7 md:h-7 text-gray-400 group-hover:text-white transition-colors flex-shrink-0" />
                                        </div>
                                    </button>

                            </div>
                        </div>

                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">
                                {success}
                            </div>

                    </div>
                );

            if (view === 'gpa') {

                                    <div className="mb-6 p-4 bg-gray-600/30 border border-gray-500/50 rounded-xl text-gray-200 text-sm text-center">

                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                                    <select 
                                        value={level} 
                                        onChange={(e) => setLevel(e.target.value)}
                                        className="p-3 bg-slate-800 border-2 border-white/20 rounded-xl text-white outline-none focus:border-indigo-400">
                                        <option value="1">السنة الأولى ثانوي</option>
                                        <option value="2">السنة الثانية ثانوي</option>
                                        <option value="3">السنة الثالثة ثانوي</option>
                                    </select>
                                    
                                    <select 
                                        value={stream} 
                                        onChange={(e) => setStream(e.target.value)}
                                        className="p-3 bg-slate-800 border-2 border-white/20 rounded-xl text-white outline-none focus:border-indigo-400">

                                            <option key={s} value={s}>{s}</option>
                                        ))}
                                    </select>

                                        <label className="flex items-center justify-center gap-2 p-3 bg-indigo-500/20 rounded-xl cursor-pointer hover:bg-indigo-500/30 transition-colors border border-indigo-500/30 flex-1">
                                            <input type="checkbox" checked={tamazight} onChange={(e) => setTamazight(e.target.checked)} className="w-5 h-5" />
                                            <span className="font-medium text-white text-sm">أمازيغية</span>
                                        </label>
                                        <label className="flex items-center justify-center gap-2 p-3 bg-indigo-500/20 rounded-xl cursor-pointer hover:bg-indigo-500/30 transition-colors border border-indigo-500/30 flex-1">
                                            <input type="checkbox" checked={art} onChange={(e) => setArt(e.target.checked)} className="w-5 h-5" />
                                            <span className="font-medium text-white text-sm">تربية فنية</span>
                                        </label>
                                    </div>
                                </div>

                                <div className="overflow-x-auto rounded-xl border-2 border-white/20 mb-6">
                                    <table className="w-full min-w-[800px]">
                                        <thead className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                                            <tr>
                                                <th className="p-3 text-center font-semibold text-sm">المادة</th>
                                                <th className="p-3 text-center font-semibold text-sm">تقويم</th>
                                                <th className="p-3 text-center font-semibold text-sm">أعمال تطبيقية</th>
                                                <th className="p-3 text-center font-semibold text-sm">فرض 1</th>
                                                <th className="p-3 text-center font-semibold text-sm">فرض 2</th>
                                                <th className="p-3 text-center font-semibold text-sm">اختبار</th>
                                                <th className="p-3 text-center font-semibold text-sm">معامل</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white/5">
                                            {gpaData.map((s, i) => (
                                                <tr key={i} className="border-t border-white/10 hover:bg-white/10 transition-colors">
                                                    <td className="p-3 text-center font-medium text-white">{s.name}</td>
                                                    <td className="p-3 text-center">
                                                        <input 
                                                            type="number" 
                                                            value={s.eval} 
                                                            onChange={(e) => {
                                                                const newData = [...gpaData];
                                                                newData[i].eval = e.target.value;
                                                                setGpaData(newData);
                                                            }}
                                                            className="w-16 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none focus:border-indigo-400" 
                                                            placeholder="0" 
                                                        />
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <input 
                                                            type="number" 
                                                            value={s.practical} 
                                                            onChange={(e) => {
                                                                const newData = [...gpaData];
                                                                newData[i].practical = e.target.value;
                                                                setGpaData(newData);
                                                            }}
                                                            className="w-16 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none focus:border-indigo-400" 
                                                            placeholder="0" 
                                                        />
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <input 
                                                            type="number" 
                                                            value={s.test1} 
                                                            onChange={(e) => {
                                                                const newData = [...gpaData];
                                                                newData[i].test1 = e.target.value;
                                                                setGpaData(newData);
                                                            }}
                                                            className="w-16 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none focus:border-indigo-400" 
                                                            placeholder="0" 
                                                        />
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <input 
                                                            type="number" 
                                                            value={s.test2} 
                                                            onChange={(e) => {
                                                                const newData = [...gpaData];
                                                                newData[i].test2 = e.target.value;
                                                                setGpaData(newData);
                                                            }}
                                                            className="w-16 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none focus:border-indigo-400" 
                                                            placeholder="0" 
                                                        />
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <input 
                                                            type="number" 
                                                            value={s.exam} 
                                                            onChange={(e) => {
                                                                const newData = [...gpaData];
                                                                newData[i].exam = e.target.value;
                                                                setGpaData(newData);
                                                            }}
                                                            className="w-16 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none focus:border-indigo-400" 
                                                            placeholder="0" 
                                                        />
                                                    </td>
                                                    <td className="p-3 text-center font-bold text-indigo-400">{s.coef}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                                    <button 
                                        onClick={calculateGPA}
                                        className="md:col-span-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                                        <LucideIcon name="trending-up" className="w-5 h-5 inline ml-2" />
                                        احسب المعدل
                                    </button>
                                    
                                    {!isGuest && (
                                        <>
                                            <button 
                                                onClick={saveData}
                                                className="bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl transition-all">
                                                <LucideIcon name="save" className="w-5 h-5 inline ml-1" />
                                                حفظ
                                            </button>
                                            <button 
                                                onClick={loadData}
                                                className="bg-gradient-to-r from-amber-600 to-orange-600 text-white font-bold py-3 rounded-xl shadow-lg hover:shadow-xl transition-all">
                                                <LucideIcon name="rotate-ccw" className="w-5 h-5 inline ml-1" />
                                                استرجاع
                                            </button>
                                        </>
                                    )}
                                </div>

                                {gpaResult && (
                                    <div className="mt-6 bg-gradient-to-r from-indigo-500/20 to-purple-500/20 rounded-2xl p-6 md:p-8 text-center border-2 border-indigo-500/30 backdrop-blur-xl result-animation">

                                        <p className="text-5xl md:text-6xl font-bold gradient-text">{gpaResult}</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {success && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">

                            </div>

                        {error && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">
                                {error}
                            </div>
                        )}
                    </div>
                );

                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-pink-900 p-4 md:p-6" dir="rtl">
                        <div className="max-w-4xl mx-auto pt-4 md:pt-8">
                            <button onClick={() => setView('home')} className="flex items-center gap-2 text-gray-300 hover:text-white mb-6 font-medium transition-colors">
                                <LucideIcon name="arrow-right" className="w-5 h-5" /><span>عودة</span>
                            </button>
                            
                            <div className="glass-effect rounded-3xl shadow-2xl p-4 md:p-8">
                                <div className="flex items-center gap-3 mb-6">
                                    <LucideIcon name="calendar" className="w-7 h-7 md:w-8 md:h-8 text-purple-400" />

                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    {[
                                        { label: 'معدل الفصل الأول', key: 't1' },
                                        { label: 'معدل الفصل الثاني', key: 't2' },
                                        { label: 'معدل الفصل الثالث', key: 't3' }
                                    ].map((field, i) => (
                                        <div key={i}>
                                            <label className="block text-white font-semibold mb-2 text-sm">{field.label}</label>
                                            <input 
                                                type="number" 
                                                value={yearlyData[field.key]}
                                                onChange={(e) => setYearlyData({ ...yearlyData, [field.key]: e.target.value })}
                                                className="w-full p-3 bg-white/10 border-2 border-white/20 rounded-xl text-white placeholder-gray-400 outline-none focus:border-purple-400 transition-all"
                                                placeholder="0.00"
                                                step="0.01"
                                            />
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={calculateYearly}
                                    className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                                    <LucideIcon name="trending-up" className="w-5 h-5 inline ml-2" />

                                </button>

                                    <div className="mt-6 bg-gradient-to-r from-purple-500/20 to-pink-500/20 rounded-2xl p-6 md:p-8 text-center border-2 border-purple-500/30 backdrop-blur-xl result-animation">

                                        <p className="text-5xl md:text-6xl font-bold gradient-text">{yearlyResult}</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        {success && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">

                            </div>
                        )}
                        {error && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">
                                {error}
                            </div>
                        )}
                    </div>
                );

            if (view === 'target') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-pink-900 to-red-900 p-4 md:p-6" dir="rtl">
                        <div className="max-w-4xl mx-auto pt-4 md:pt-8">
                            <button onClick={() => setView('home')} className="flex items-center gap-2 text-gray-300 hover:text-white mb-6 font-medium transition-colors">
                                <LucideIcon name="arrow-right" className="w-5 h-5" /><span>عودة</span>
                            </button>
                            
                            <div className="glass-effect rounded-3xl shadow-2xl p-4 md:p-8">
                                <div className="flex items-center gap-3 mb-6">
                                    <LucideIcon name="target" className="w-7 h-7 md:w-8 md:h-8 text-pink-400" />
                                    <h2 className="text-2xl md:text-3xl font-bold text-white">حساب العلامة المطلوبة</h2>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                    {[
                                        { label: 'المعدل المطلوب', key: 'target' },
                                        { label: 'علامة التقويم', key: 'eval' },
                                        { label: 'علامة الفرض 1', key: 'test1' },
                                        { label: 'علامة الفرض 2', key: 'test2' }
                                    ].map((field, i) => (
                                        <div key={i}>
                                            <label className="block text-white font-semibold mb-2 text-sm">{field.label}</label>
                                            <input 
                                                type="number" 
                                                value={targetData[field.key]}
                                                onChange={(e) => setTargetData({ ...targetData, [field.key]: e.target.value })}
                                                className="w-full p-3 bg-white/10 border-2 border-white/20 rounded-xl text-white placeholder-gray-400 outline-none focus:border-pink-400 transition-all"
                                                placeholder="0.00"
                                                step="0.01"
                                            />
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={calculateTarget}
                                    className="w-full bg-gradient-to-r from-pink-600 to-red-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                                    <LucideIcon name="trending-up" className="w-5 h-5 inline ml-2" />
                                    احسب العلامة المطلوبة
                                </button>

                                {targetResult && (
                                    <div className="mt-6 bg-gradient-to-r from-pink-500/20 to-red-500/20 rounded-2xl p-6 md:p-8 text-center border-2 border-pink-500/30 backdrop-blur-xl result-animation">
                                        <p className="text-gray-300 text-lg mb-3">العلامة المطلوبة في الاختبار</p>
                                        <p className="text-5xl md:text-6xl font-bold gradient-text">{targetResult}</p>
                                        {parseFloat(targetResult) > 20 && (
                                            <p className="text-red-300 mt-4 font-semibold">⚠️ من المستحيل تحقيق هذا المعدل</p>
                                        )}
                                        {parseFloat(targetResult) < 0 && (
                                            <p className="text-green-300 mt-4 font-semibold">🎉 أنت متفوق! حققت المعدل المطلوب</p>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {success && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">
                                {success}
                            </div>
                        )}
                        {error && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">
                                {error}
                            </div>
                        )}
                    </div>
                );
            }

            // BAC View
            if (view === 'bac') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-cyan-900 to-blue-900 p-4 md:p-6" dir="rtl">
                        <div className="max-w-5xl mx-auto pt-4 md:pt-8">
                            <button onClick={() => setView('home')} className="flex items-center gap-2 text-gray-300 hover:text-white mb-6 font-medium transition-colors">
                                <LucideIcon name="arrow-right" className="w-5 h-5" /><span>عودة</span>
                            </button>
                            
                            <div className="glass-effect rounded-3xl shadow-2xl p-4 md:p-8">
                                <div className="flex items-center gap-3 mb-6">
                                    <LucideIcon name="graduation-cap" className="w-7 h-7 md:w-8 md:h-8 text-cyan-400" />
                                    <h2 className="text-xl md:text-3xl font-bold text-white">حساب معدل شهادة البكالوريا</h2>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                                    <select 
                                        value={bacStream} 
                                        onChange={(e) => setBacStream(e.target.value)}
                                        className="p-3 bg-slate-800 border-2 border-white/20 rounded-xl text-white outline-none focus:border-cyan-400">
                                        {db["3"] && Object.keys(db["3"]).map(s => (
                                            <option key={s} value={s}>{s}</option>
                                        ))}
                                    </select>

                                    <label className="flex items-center justify-center gap-2 p-3 bg-cyan-500/20 rounded-xl cursor-pointer hover:bg-cyan-500/30 transition-colors border border-cyan-500/30">
                                        <input type="checkbox" checked={bacTamazight} onChange={(e) => setBacTamazight(e.target.checked)} className="w-5 h-5" />
                                        <span className="font-medium text-white">أمازيغية</span>
                                    </label>
                                </div>

                                <div className="overflow-x-auto rounded-xl border-2 border-white/20 mb-6">
                                    <table className="w-full">
                                        <thead className="bg-gradient-to-r from-cyan-600 to-blue-600 text-white">
                                            <tr>
                                                <th className="p-3 text-center font-semibold">المادة</th>
                                                <th className="p-3 text-center font-semibold">العلامة</th>
                                                <th className="p-3 text-center font-semibold">المعامل</th>
                                                <th className="p-3 text-center font-semibold">المجموع</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white/5">
                                            {bacData.map((s, i) => (
                                                <tr key={i} className="border-t border-white/10 hover:bg-white/10 transition-colors">
                                                    <td className="p-3 text-center font-medium text-white">{s.name}</td>
                                                    <td className="p-3 text-center">
                                                        <input 
                                                            type="number" 
                                                            value={s.mark} 
                                                            onChange={(e) => {
                                                                const newData = [...bacData];
                                                                newData[i].mark = e.target.value;
                                                                setBacData(newData);
                                                            }}
                                                            className="w-20 md:w-24 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none focus:border-cyan-400" 
                                                            placeholder="0" 
                                                        />
                                                    </td>
                                                    <td className="p-3 text-center font-bold text-cyan-400">{s.coef}</td>
                                                    <td className="p-3 text-center font-bold text-white">
                                                        {s.name === "أمازيغية" 
                                                            ? `+${(Math.max(0, (parseFloat(s.mark) || 0) - 10) * s.coef).toFixed(2)}`
                                                            : ((parseFloat(s.mark) || 0) * s.coef).toFixed(2)
                                                        }
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <button 
                                    onClick={calculateBAC}
                                    className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 mb-6">
                                    <LucideIcon name="trending-up" className="w-5 h-5 inline ml-2" />
                                    احسب النتيجة النهائية
                                </button>

                                {bacResult && (
                                    <div className="bg-gradient-to-r from-cyan-500/20 to-blue-500/20 rounded-2xl p-6 md:p-8 border-2 border-cyan-500/30 backdrop-blur-xl result-animation">
                                        <div className="grid grid-cols-3 gap-4 text-center">
                                            <div>
                                                <p className="text-gray-300 text-sm mb-2">المجموع</p>
                                                <p className="text-3xl font-bold text-cyan-400">{bacResult.points}</p>
                                            </div>
                                            <div>
                                                <p className="text-gray-300 text-sm mb-2">المعاملات</p>
                                                <p className="text-3xl font-bold text-cyan-400">{bacResult.coef}</p>
                                            </div>
                                            <div>
                                                <p className="text-gray-300 text-sm mb-2">المعدل</p>
                                                <p className="text-3xl font-bold gradient-text">{bacResult.avg}</p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {success && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">
                                {success}
                            </div>
                        )}
                        {error && (
                            <div className="fixed top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-2xl shadow-2xl z-50">
                                {error}
                            </div>
                        )}
                    </div>
                );
            }

            return null;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<GradeCalculator />);
    </script>
</body>
</html>
